l_english:
 # 인트로
 MEX_country_intro_header: "포르피리아토의 종말"
 MEX_country_intro_content: "1910년, 근대화 개혁을 이끈 대통령이자 폭군 §L포르피리오 디아스§!에 맞선 혁명의 불길이 피어나며 §L멕시코 혁명§!이 시작되었습니다. 포르피리오 디아스는 결국 프랑스로 도망쳤고, 그 사악한 영혼은 마침내 지옥불에 떨어졌으나, 그가 남긴 잔불, 즉 포르피리아토(Porfiriato)의 잔불은 여전히 멕시코의 민중들을 괴롭혔습니다.\n\n포르피리오 디아스가 물러난 이후 집권한 프란시스코 마데로는 멕시코 혁명의 주역이었던 농민들이 원했던 토지 개혁을 끝내 이루지 않았습니다. 우유부단함에 사로잡힌 프란시스코 마데로는 끝내 마누엘 몬드라곤 장군의 쿠데타를 허용하고 말았으며, 반란을 진압하기 위해 파견된 빅토리아노 우에르타 장군이 그를 배신하고 살해하며, 그렇게 빅토리아노 우에르타 장군의 집권이 시작되었습니다."
 MEX_country_intro_header_1: "로스 캄페시노스(Los campesinos)"
 MEX_country_intro_content_1: "빅토리아노 우에르타 장군을 향한 대중들의 분노는 굉장했습니다. 정치적으로 무능했을지 언정 대중들에게 꿀리지 않는 인기를 지니고 있었던 프란시스코 마데로 대통령의 죽음은 혼란을 불러일으켰으며, 포르피리오 디아스를 몰아냈던 에밀리아노 사파타와 알바로 오브레곤, 판초 비야가 다시 한번 일어나 빅토리아노 우에르타 정부에 맞서, 마데로 대통령의 고향이었던 베누스티아노 카란사를 대통령으로 하는 "호헌 혁명군" 을 조직했습니다.\n\n혁명군은 우에르타 장군을 궁지로 몰아넣었으나 미국 해군이 독일 선박의 무기 회수를 빌미로 대며 베라크루즈 일대를 장악하자, 수많은 멕시코인들이 우에르타 장군을 지지했습니다. 설상가상으로 혁명군 내부는 멕시코의 토지, 사회 개혁의 문제로 농촌의 사파타-비야 파와 도시의 카란사-오브레곤 파로 분열되기 시작했습니다."
 MEX_country_intro_header_2: "계속 되는 혁명"
 MEX_country_intro_content_2: "비야-사파타파와 카란사-오브레곤파의 전투에서, 당시 최신 전법이었던 대전쟁 당시의 전법을 도입한 카란사-오브레곤파에게 비야-사파타파가 패배하고, 에밀리아노 사파타가 암살당하면서 카란사-오브레곤파는 승리를 거두었으나, 카란사파가 내부적으로 분열되기 시작했습니다.\n\n비야-사파타파의 주장을 받아들일 생각이 없었던 카란사와 달리 실질적으로 혁명에 참가한 장군들과 병사들은 그들의 주장을 대부분 받아들였으며, 이는 카란사와 장군들간의 갈등이 되었습니다. 카란사 스스로가 대통령이 되어 집권했을 때에도 1917년 세워진 헌법을 무시하고 집권을 이어나갔으며, 카란사가 자신의 파벌 아래에 있던 정부군 장교에게 암살당하며 그렇게 홀로 남은 오브레곤과 그의 파벌이 승자가 되었습니다.\n\n오브레곤은 비야-사파타파와의 평화협상을 시작했습니다. 이후에 벌어진 포르피리오 디아스에게 지지를 보내던 가톨릭 사제들, 크리스테로와의 전쟁을 제외하면 멕시코는 상대적으로 평화로운 시기를 보냈습니다."
 MEX_country_intro_header_3: "혁명을 완수하라"
 MEX_country_intro_content_3: "혁명 이후, 오브레곤파에 속해있던 혁명 지도자 플루타르코 카예스는 멕시코 혁명 기간동안 살아남은 지도자들을 모아 세워진 멕시코 혁명당을 세웠습니다.\n\n카예스는 암살당한 오브레곤의 뒤를 이어 독재를 시도했으나, 라사로 카르데나스에 의해 그 시도가 좌절되었습니다. 카예스는 도망자 신세가 되었으며, 라사로 카르데나스는 1934년 부터 집권을 시작해 멕시코의 발전에 박차를 가하기 시작했습니다."
 MEX_country_intro_header_4: "로스 키보토스"
 MEX_country_intro_content_4: "그러나 그들 앞에 예상치 못한 이들이 나타났습니다. 유럽에 키보토스라는 이계인들이 처들어오기 시작했고, 그렇게 수많은 유럽인들이 자신들의 고향을 잃고 세계 각지로 향하기 시작했습니다. 멕시코 또한 그 국가들중 하나였으며, 이미 수많은 유럽인들이 멕시코를 향해 피난을 떠났습니다.\n\n내부적으로는 심각한 문제를 겪고 있습니다. 사투르니노 세디요 장군은 멕시코의 중앙집권화를 시도하는 라사로 카르데나스의 결정에 크게 반발하고 있으며, 언제든 카르데나스 정부를 뒤엎을 준비를 하고 있습니다. 뿐만아니라 미국과의 무역이 대폭 감소한 멕시코에게 유럽이라는 시장의 상실은 치명타로 다가왔습니다.\n\n대공황에 벗어나지 못한 멕시코의 운명은 어떻게 될까요? 어쩌면 독재자 포르피리오 디아스 조차도 알지 못할 것입니다.\n\n§Y개발 : Pencildude§!"

 # 가이드
 MEX_guide: "마테오스 루트 - 멕시코의 키보토스화를 통해 급진적인 혁명을 노려보십시오.\n카르데나스 루트 - 멕시코의 역사적 상황을 겪어보십시오. 키보토스인들에게 멕시코가 그저 듣도보도 못한 국가가 아님을 증명하십시오.\n우르키사 루트 - 거짓된 혁명을 종결시키고, 아메리카를 무너뜨려 주님을 위한 성전을 벌이십시오."
 
 # 인물 설명
 MEX_cardenas_desc: "라사로 카르데나스는 단순한 남자가 아닙니다. 포르피리오 디아스의 폭정을 무너뜨린 멕시코 혁명에 동참한 그는 마데로 대통령의 죽음 이후로 일어난 우에르타 정권의 폭정, 자신의 벗들과 카우디요 에밀리아노 사파타와 판초 비야가 목숨을 잃는 와중에도 끝까지 살아남았으며, 이후 벌어진 가톨릭 신도들의 반란이었던 크리스테로 전쟁에도 참전하며 많은 혁명 동지들에게 그의 용맹함을 보여주었습니다.\n\n국민혁명당을 이끌던 라사로 카르데나스는 당시 막시마토(Maximato) 체제를 이끌던 카예스에 의해 대통령직에 오르기 까지 했으며, 이전 대통령들과 마찬가지로 카르데나스를 꼭두각시로 이용하려던 카예스의 계략을 뛰어넘었습니다. 카르데나스는 권력을 휘어잡았고, 카예스는 도망자 신세가 되었으며, 그의 파벌의 위세는 상당히 꺾였습니다. 비록 갑작스레 유럽에 발생한 대전이로 인해 카예스파 숙청작업이 조금이나마 늦어져 여전히 그 잔불이 남아있지만 말입니다.\n\n혁명의 베테랑이자 멕시코 합중국의 대통령, 라사로 카르데나스는 이웃한 거인의 대공황과 유럽의 대전이의 여파로 인해 흔들리는 멕시코를 앞으로 다가올 폭풍속에서 버티게 할 준비를 하고 있지만, 아메리카에까지 뻗친 대전이라는 폭풍을 멕시코가 완전히 버틸수 있으리라고 확신하는 이는 아무도 없어보입니다."
 MEX_veteran: "혁명의 베테랑"

 MEX_adolfo_lopez_mateos: "아돌포 로페스 마테오스"
 MEX_mateos_desc: "마테오스 집안의 막내로서 태어난 아돌포 로페스 마테오스는 애국심에 불타오르는 청년입니다. 뛰어난 운동신경과 명석한 두뇌를 지닌 그는 1929년 자신의 스승이자 존경하는 인물이었던 호세 바스콘셀로스가 대선에서 패배하는 것을 지켜보며 분개하였으며, 곧이어 이어진 박해를 피해 과테말라에 잠시동안 거주했습니다. 이후 1930년 멕시코로 돌아온 그는 변호사 자격을 취득했고, 멕시코 혁명당에 입당했습니다.\n\n마테오스 특유의 인간적 매력과 카리스마는 그가 정계로 진출하는데에 큰 도움을 주었습니다. 권투를 하던 그의 손에는 이제 펜과 서류가 쥐어져 있습니다. 그는 여전히 정치적으로 혼란에 빠진 멕시코를 안정적으로 만드는 것을 넘어, 이웃한 거인 그 이상의 존재로 만들길 원합니다.\n\n유럽에 나타난 키보토스라는 존재는 마테오스에게 기회로서 다가왔습니다. 그들의 발전된 기술, 그리고 사회구조는 멕시코를 더욱 위대하게, 멕시코가 잃어버린 영광을 되찾고 혁명의 가치를 보전하게 해줄것을 믿어 의심치 않고 있습니다. 그의 비전이 크리스테로들과 멕시코 혁명 베테랑들의 반발에 부딪히는 한이 있더라도 말입니다."
 MEX_reformer: "개혁가"

 MEX_jose_antonio_urquiza: "호세 안토니오 우르키사"
 MEX_urquiza_desc: "호세 안토니오 우르키사는 멕시코의 시나키즘을 발흥시킨 남자이자, 혁명으로 인해 모든것을 잃은 남자입니다. 우르키사는 부유한 지주 집안에서 태어난 남자였습니다. 그의 삶은 탄탄대로를 걸어가고 있었으나, 유복한 삶을 보내던 그에게 닥쳐온 멕시코 혁명은 집안의 수많은 자산을 허무하게 날려버리는 계기가 되었으며, 이후 우르키사가 국민공동통치연합(UNS)를 창립하는 동력이 되었습니다.\n\n1935년 10월, 유럽이 대전이라는 불길에 휘말리게 되자, 우르키사는 과나후아토에서 회의를 열어 마누엘 토레스 부에노, 살바도르 아바스칼, 그리고 수많은 멕시코의 가톨릭 교도들과 함께 UNS를 창설했습니다. 그의 목적은 단순합니다. 주님의 딸 키보토스와 함께 이교도들을 향한 전쟁을 끝내는 것, 멕시코가 다시한번 주님의 뜻 아래에 위대해 지는 것, 그리고 무엇보다 거짓되며, 증오스러운 혁명을 완전히 종식시키는 것 입니다."

 MEX_juan_andreu_almazan: "후안 안드레우 알마산"
 MEX_juan_andreu_almazan_trait: "베테랑 사업가"
 MEX_almazan_desc: "후안 안드레우 알마산의 삶은 매우 복잡하다고 말할 수 밖에 없을 것 입니다. 본디 사파타의 남부 해방군에 소속되어 있었던 혁명군 병사 알마산은 사파타가 암살 된 이후 카란사의 대통령 직을 부정하는 오브레곤의 아과프리에타 계획에 가담하였으며, 이후 카란사를 몰아낸 알마산은 아과프리에타 계획에 함께한 카예스에게 충성했습니다.\n\n카예스가 물러나며 카르데나스가 자리를 잡게 되자 자신이 생각하던것 보다 3년 빨리 군복을 벗게 된 알마산은 돈을 다루는 능력을 이용해 멕시코에서 가장 부유한 이들 중 하나로서 가듭났습니다."

 MEX_ignacio_anaya: "이그나시오 아나야"
 MEX_ignacio_anaya_trait: "훌륭한 주방장"
 MEX_anaya_desc: "미국 국경지대에서 식당을 차리며 살아가던 이그나시오 아나야는 어찌보면 대전이의 혜택을 받은 얼마 안되는 이들 중 한명일 것입니다. 아나야의 식당의 근처에는 미군 기지가 자리하고 있었으며, 그의 훌륭한 요리 솜씨는 미군들의 마음과 혀를 즐겁게 해주는 위안거리가 되어주었습니다.\n\n대전이 이후로 그가 만든 새로운 요리, 나초는 순식간에 유명세를 탔습니다. 미국뿐만 아니라 멕시코를 휩쓴 아나야의 나초는 멕시코의 국민음식으로서 자리잡게 되었습니다."

 MEX_emilio_portes_gil: "에밀리오 포르테스 힐"
 MEX_emilio_portes_gil_trait: "막시막토의 흔적"
 MEX_gil_desc: "§L1928년 물러난 플루타르코 카예스의 뒤를 이어 대통령이 된 에밀리오 포르테스 힐은 오브레곤이 암살당했을때 카예스의 권력욕에 의해 선택된 정치인이었습니다. 카예스의 꼭두각시 신세였음에도 불구하고 힐은 자신이 할 수 있는 것들을 하려고 애썼습니다. 크리스테로 전쟁 당시의 사병들을 사면해주고, 정부 관리들이 자기 이익만을 쫓지 않게 하도록 막았습니다.\n\n카예스가 권력을 붙잡으려 온몸을 비틀었음에도, 카예스는 결국 사실상 권력에서 내쫓긴 신세가 되고 말았습니다. 카르데나스는 힐에게 카예스파 숙청을 요청했으며, "카예스가 내다버린 꼭두각시 대통령"이라는 칭호를 가지고 있었던 힐은 이에 기꺼이 봉사하고 있습니다.§!"

 MEX_jose_genaro_kingo_nonaka: "호세 헤나로 킨고 노나카"
 MEX_jose_genaro_kingo_nonaka_trait: "베테랑 출신 사진작가"
 MEX_nonaka_desc: "1889년 후쿠오카 규슈에서 태어나고 자란 노나카 킨고는 일곱 남매들중 가장 모험심이 강한 아이였습니다. 어린시절부터, 학교에서 공부를 하고 집에 돌아와서 밭을 가는 것에 만족하지 못한 아이였습니다. 그렇게 1906년, 킨고는 자신의 삼촌과 형과 함께 멕시코 오아하카로 이주했으며, 이름또한 호세 헤나로 킨고 노나카로 개명했습니다.. 농장의 힘든일에 지친 킨고는 미국으로 3개월 동안의 여정을 떠났으며, 이후 멕시코로 돌아왔을 때때 치와와의 현지 가족들에게 입양되었으며, 그곳에서 의술을 배웠습니다.\n\n1911년, 포르피리오 디아스에 맞선 혁명이 일어나던 와중 그는 혁명군의 대통령 프란시스코 마데로를 치료하게 되었으며, 그렇게 그는 마데로의 혁명군에 징집되었습니다. 이후 시우다드후아레스에서 그는 병사들을 치료하며 시간을 보냈습니다. 그렇게 마데로는 총 14번의 전투에 참가했으며, 마데로와 혁명 지도자 판초 비야를 위해 싸웠습니다.\n\n혁명이 끝난 이후 그는 바하칼리포르니아 티후아나에 정착했습니다. 멕시코 혁명 이후로 킨고는 사진작가로서 활동했으며, 그의 티후아나의 변화를 찍은 사진은 오늘날 멕시코인들에게 큰 사랑을 받고 있습니다."

 MEX_nicolas_rodriguez_carrasco: "니콜라스 로드리게스 카라스코"
 MEX_nicolas_rodriguez_carrasco_trait: "황금 셔츠단의 지도자"
 MEX_carrasco_desc: "멕시코주 치와와에서 나고 자란 니콜라스 로드리게스 카라스코와 그의 가족은 어린 시절부터 훗날 혁명의 주역이 되는 판초 비야와 친밀한 관계를 맺어왔습니다. 멕시코 혁명에 직접적으로 참가하진 않았지만, 아이러니 하게도 그의 아버지는 카란사의 혁명군에 소속되어 싸웠습니다.\n\n카라스코는 엔리케 에스타라다 장군이 이끈 델라우에르티스타 반란에 가담한 혐의로 텍사스로 추방되었으며, 이후 1928년 1년동안 감옥살이를 하며 지냈습니다. 카라스코는 치와와주 주지사인 로드리고 케베도 장군의 추천으로 석방되어 고향으로 돌아왔습니다. 로드리게스 카라스코는 반공주의, 반노조주의, 극단적 민족주의를 주장 하는 녹색셔츠단을 결성했습니다. 이후 아벨라르도 로드리게스 대통령이 의해 해산되자 혁명적 멕시코주의자 행동당(ARM)을 창당하고 준군사조직 금빛 셔츠단의 우두머리로서 활동했습니다.\n\n수많은 멕시코 혁명 베테랑들과 장군들이 이 조직에 가입했으며, 대전이가 발발한 이후 카라스코는 이를 기회로 보았습니다. 카라스코는 UNS에 자신의 정당과 당원들을 불러모았으며, 멕시코인들을 위한 멕시코를 만들어나가길 다짐하고 있습니다."

 #MEX_luis_maria_martinez: "루이스 마리아 마르티네스" >바닐라 로컬 존재
 MEX_luis_maria_martinez_trait: "멕시코 가톨릭 대주교"
 MEX_martinez_desc: "루이스 마리아 마르티네스는 온화한 성격의 멕시코 가톨릭 대주교로, 미초아칸에서 함께 젊은 시절을 보낸 카르데나스 대통령과 절친한 사이였습니다. 카르데나스가 정권을 잡았을때, 대주교였던 마르티네스와 대통령 카르데나스의 우호적인 관계는 교회와 국가 간의 격차를 메웠으며, 멕시코 혁명 이후 지속된 가톨릭 신도와 멕시코의 좌익 간의 적대감을 진정시켰습니다.\n\nUNS가 다양한 우익 세력, 카르다네스에게 반감을 품고있는 다양한 인물들을 흡수하고 있는 상황속에서, 마르티네스 대주교는 적대감을 진정시키기 위한 노력을 하고 있습니다. 그는 최선을 다할 것입니다. 적어도 멕시코의 시민들이 그의 말에 귀를 기울인다면 말이죠."

 MEX_efrain_buenrostro_ochoa: "에프라인 부엔로스트로 오초아"
 MEX_efrain_buenrostro_ochoa_trait: "훌륭한 경제장관"
 MEX_ochoa_desc: "평범한 경제장관에서, 멕시코의 경제를 조금이나마 회생시킨 인물, 그에 대해 알고 있는 사람이라면, 그가 쓰러져 가는 멕시코 경제를 완전히 쓰러지지 않게 둔 사람이라는 것을 알 것입니다.\n\n오초아는 어린시절부터 라사로 카르데나스의 학교 친구였으며, 1914년, 멕시코 혁명 당시 오초아는 호세 마리아 부엔로스트로 중령의 지휘 하에 제4기병연대의 입헌군에 입대하여 판초 비야의 군대와 맞서 싸웠습니다.\n\n혁명 이후 오초아는 카르데나스 정부의 경제부 장관으로서 임명되었습니다. 더 나은 멕시코 경제를 위해 노력한 그는 대전이 당시의 영국의 붕괴 이후, 영국의 석유회사였던 로열 더치 쉘을 국유화 하였으며, 전기 회사와 기술자간의 갈등도 중재하는데 큰 도움을 주었습니다.\n\n많은 사람들이 오초아에게 정치인이냐고 물었을때, 그는 이렇게 답합니다.\n\n"저는 정치인이 아니라, 공무원일 뿐입니다.""
 
 #MEX_salvador_abascal: "살바도르 아바스칼" >바닐라 로컬 존재
 MEX_salvador_abascal_trait: "UNS의 2인자"
 MEX_abascal_desc: "게이 아바스칼"

 MEX_manuel_torres_bueno: "마누엘 토레스 부에노"
 MEX_manuel_torres_bueno_trait: "온화한 시나키스트"
 MEX_bueno_desc: "마누엘 토레스 부에노에 대한 사실에 대해 알려진것은 거의 없다시피 합니다. 그가 어디서 태어났는지, 자라온 배경또한 완전히 베일에 싸여있는 인물입니다. 그러나 한가지 확실한것이 있다면, 젊은 나이에도 불구하고 UNS의 가장 높은 자리에까지 등극했다는, 그의 능력 덕분이라고 할 수 있을 것입니다.\n\n키보토스 사태가 나타남과 동시에, 우르키사는 시나키즘 운동을 정당으로까지 올릴 생각까지 없었던 아바스칼의 반대에도 불구하고 UNS를 정당으로까지 끌어올렸으며, 이 과정에서 마누엘 토레스 부에노는 정당을 창설하는데 적지 않은 기여를 했습니다.\n\n창설 이후 마누엘 토레스 부에노는 다양한 인물들을 끌어오는데 집중하기 시작했습니다. 카르데나스를 적대하는 혁명군들, 시나키즘에 매력을 느낀 일반인들, 그리고 포르피리아토의 잔재와 크리스테로 전쟁의 가톨릭 교도들까지 한데모아 UNS로 불러들이고 있습니다. 물론 이 상황을 아바스칼은 그리 좋게 보고있지 않지만 말입니다."

 MEX_gustavo_saenz_de_sicilia: "구스타보 사엔스 데 시실리아"
 MEX_gustavo_saenz_de_sicilia_trait: "파시스트 영화감독"
 MEX_sicilia_desc: "구스타보 사엔스 데 시실리아는 빅토리아노 우에르타 정권에 함께하여 프란시스코 마데로 대통령 암살에 관여한 인물이자 극렬한 반공주의자로, 이후 이탈리아의 영향으로 멕시코 파시스트당을 창당했습니다. 그의 파시스트 정당은 얼마되지 않아 해산되었지만, 그는 상관없었습니다. 그는 무성영화 사업을 시작했습니다.\n\n1932년, "산타"라는 이름의 영화를 내놓은 시실리아는 커다란 성공을 누렸으며, 그가 유명해지는 결과를 낳았습니다. 그러나 극렬한 반공주의로 인해 멕시코 노동당이 영화 상영을 금지했으며, 그렇게 감독자리에서 은퇴할 수 밖에 없었던 그는 UNS에 가입하여 자신의 뜻을 이루고자 하고 있습니다.\n\n그 무엇도 아닌, 위대한 멕시코라는 꿈을 말이죠."

 # 장군
 MEX_pablo_quiroga_escamilla: "파블로 키로가 에스카미야"
 MEX_escamilla_desc: "1875년 시에네가 데 플로레스에서 태어난 에스카미야 장군은 1913년 38세라는 나이에 멕시코 혁명군에 입대했으며, 1914년에는 대령으로, 1916년엔 장군으로 쾌속 진급을 이뤄낸, 혁명당시 25회 이상의 작전을 지휘한 멕시코 혁명의 베테랑입니다.\n\n카란사의 죽음이후로 군대를 떠난 그는 공무원으로서 1929년 에스코바르 장군의 반란을 진압하였고, 카르데나스 정부의 전쟁장관으로서 일했습니다. 그러나 대전이 사태가 벌어짐에 따라 카르데나스의 명령으로 에스카미야는 군에 복귀했으나, 정작 본인은 그렇게 까지 달가워하지 않아하고 있습니다."
 MEX_pablo_macias_valenzuela: "파블로 마시아스 발렌수엘라"
 MEX_joaquin_amaro_dominguez: "호아킨 아마로 도밍게스"
 MEX_juan_gonzalez_cabral: "후안 곤살레스 카브랄"
 MEX_cabral_desc: "1883년 멕시코 소노라주에서 태어난 후안 곤살레스 카브랄은 멕시코 혁명의 발발 이후 직접 무기를 들고 혁명군에 가담했으며, 포르피리오 디아스를 몰아낸 이후로는 알바로 오브레곤과 손을 잡으며 빅토리아노 우에르타와의 정부군과 전투를 벌였습니다. 혁명 이후 카브랄은 파나마, 페루, 에콰도르 등지에서 전권대사를 지냈으며, 이후 멕시코 정부 내무부 차관에도 임명되었습니다.\n\n대전이 사태로 인해 벌어진 내부 혼란기 이후, 카브랄은 자신을 진급해 줄것을 요청했으며, 카르데나스가 이를 승낙함에 따라 그는 멕시코군의 장군직에 남아 있습니다."
 MEX_francisco_luis_urquizo_benavides: "프란시스코 루이스 우르키소 베나비데스"
 MEX_benavides_desc: "1911년, 20살의 나이에 우르키소는 혁명군에 입대했습니다. 포르피리오 디아스의 사임 이후에도 우르키소는 베누스티아노 카란사의 편을 들어 우에르타 정권에 저항했으며, 이후 25세라는 젊은 나이에 준장으로 진급했습니다. 우르키소는 판초 비야와 그의 파벌보단 카란사에 더 충성했으나, 카란사 대통령이 암살당한 이후 감옥에 투옥되었으며, 이후 풀려난 그는 유럽으로의 망명을 선택했습니다.\n\n이후 1934년 멕시코로 귀국한 그는 대통령 카르데나스의 초빙으로 군에 복귀했으며, 이후 유럽에서의 대전이 사태가 벌어진 이후로 그는 소장 계급으로 더 빠른 진급을 이루어내었습니다."
 MEX_pablo_gonzalez_garza: "파블로 곤살레스 가르사"
 MEX_garza_desc: "1879년 5월 5일 누에보레온에서 태어난 파블로 곤살레스 가르사는 초등 교육을 마치는 대로 엘파소에서 산타페를 잇는 철도 노동자로서 생활하며 시간을 보냈습니다. 1911년, 멕시코 혁명이 벌어지던 와중 가르사는 마데로의 혁명군에 입대했으며, 포르피리오 디아스의 군대와 싸우고 전공을 조금씩 쌓아가던 그는 이후 기병 장교 중령으로서 진급했습니다.\n\n이후 우에르타 장군에 맞선 호헌 혁명이 시작되었을때 카란사의 혁명군에 선 가르사는, 이후 에밀리아노 사파타를 무력화 하는데 앞장섰습니다. 이후 카란사가 암살당하고 아과프리에타 계획을 인정하지 않은 가르사는 봉기를 시도했으나 진압당했고, 사형을 선고 받았으나 판결이 유예되었습니다. 이후 가르사는 미국으로 망명했습니다.\n\n1929년 대공황 이후 가르사 장군은 빈곤에 시달려왔습니다. 대전이가 발발하고, 유럽이 혼란에 빠지기 시작했을때 카르데나스는 가르사에게 돌아와 줄 것을 요청했으며, 가르사는 멕시코군으로 복귀하였습니다."

 MEX_marcelino_garcia_barragan: "마르셀리노 가르시아 바라간"
 MEX_agustin_olachea_aviles: "아구스틴 올라체아 아빌레스"
 

 # 국민정신
 MEX_the_ghost_of_calles: "카예스의 망령"
 MEX_the_ghost_of_calles_desc: "플루타르코 카예스가 라사로 카르데나스를 꼭두각시로 이용하려던 시도가 좌절된 이후로 카예스파 인물들은 카르데나스의 사회, 군사 개혁에 의해 요직에 해임되며 정치적으로 숙청되어 갔습니다. 플루타르코 카예스는 카르데나스를 제거하려 시도했으나, 결과적으로 카예스는 실패했습니다.\n\n대전이 사태로 인해 유럽이라는 시장을 잃은 멕시코는 내부의 경제와 사회문제를 수습해야만 했으며, 카르데나스와 PNR은 약화된 카예스를 잠시나마 시선에서 떼어냈습니다. 하지만 카예스와 그의 파벌은 여전히 멕시코에 도사리고 있으며, 멕시코 정계에 크든 작든 악영향을 끼치고 있습니다."
 MEX_incident_of_kivotos: "키보토스 사태"
 MEX_incident_of_kivotos_desc: "키보토스 사태(Incidente de Kivotos)는 멕시코 사회에 나타난 국민공동통치연합(UNS)의 갑작스런 발흥과 대전이를 통해 나타난 사회적 혼란을 의미합니다. UNS와 정당 지도자 우르키사는 유럽에 나타난 대전이 사태를 "주님의 대리인이 보낸 징벌"이라고 주장했으며, 대공황과 유럽 시장 상실로 인해 내부적으로 혼란에 빠진 수많은 멕시코인들이 UNS와 우르키사를 지지하기 시작했습니다. 우르키사가 멕시코의 정권을 차지하거나 카르데나스가 이 상황을 해결하지 않는 한 이 상황은 계속 이어 질 것입니다."
 MEX_british_oil_nationalization: "영국 유전 국유화"
 MEX_british_oil_nationalization_desc: "대전이 이후 서유럽이 무너지는 것을 지켜본 멕시코는 석유 시추권의 60퍼센트 가량을 차지하던 영국과 네덜란드의 합자 회사였던 로열 더치 쉘을 국유화 하며 대전이와 대공황으로 인해 얻은 손실을 어느정도 회복했습니다. 그러나 영국의 석유 시추권을 국유화 하는 선택은 영국의 석유 재벌들의 분노를 불러일으켰으며, 지금까지도 영국과의 관계는 회복될 기미가 보이지 않고 있습니다"
 MEX_la_reforma: "라 레포르마"
 MEX_la_reforma_desc: "카르데나스의 중앙집권화에 반대했던 사투르니노 세디요 장군이 감옥에 투옥되면서 정부의 중앙집권화를 막을 이들은 이제 사라졌습니다. 농업용 토지 에히도의 분배, 대전이로 인해 발생한 키보토스 위기를 이겨내기 위한 국내 산업화의 시작은 멕시코 사회를 이 끈적이는 침체의 늪지대에서 멕시코를 탈출시켜 줄 것입니다."
 MEX_divided_army: "분열된 군대"
 MEX_divided_army_desc: "포르피리오 디아스를 몰아낸 이후에도 멕시코 혁명군은 동포들간의 피비린내나는 싸움을 마주해야만 했습니다. 오랜 세월이 흐른 지금은 어느정도 가라앉았다지만, 키보토스 사태와 함께 좌파, 우파 준군사조직이 발흥하기 시작했고, 정부군 내부로는 혁명의 가치를 의심하는 이들이 발생하기 시작했습니다. 행동하지 않는다면 멕시코는 이전처럼 끔찍한 내전에 시달릴 것입니다."

 # 중점
 MEX_focus_plan_of_agua_prieta: "카예스파 숙청"
 MEX_focus_plan_of_agua_prieta_desc: "카예스는 더이상 멕시코의 위협이 되지 않겠지만, 그의 파벌은 여전히 위협적입니다. 혁명을 배반하려 한 그를 내쫓기 위해, 그의 잔불을 꺼뜨려야만 합니다."
 MEX_focus_exile_calles: "마테오스의 개혁"
 MEX_focus_exile_calles_desc: "아돌포 로페스 마테오스는 애국심에 타오르는 청년으로, 멕시코 혁명당에 입당한지 얼마안된 젊고 열정적인 사내입니다. 매우 진보된 기술과 사회를 가진 키보토스란 존재는 그에게 큰 매력으로 다가왔으며, 라사로 카르데나스는 그의의 유럽으로의 파견을 결정했습니다."
 MEX_focus_support_general_cedillo: "카르데나스의 질서 유지"
 MEX_focus_support_general_cedillo_desc: "아돌포 로페스 마테오스라는 청년이 맞을진 모르겠지만, 이 미쳐가는 세상속에서 유럽은 완전히 엉망진창이 되어버렸습니다. 갈수록 늘어만가는 유럽인 이민자들의 행렬속에서, 멕시코는 어떻게든 버텨내어야만 합니다. 키보토스는 우리가 감히 신경써야할 존재가 아니니까 말입니다."
 MEX_focus_interior_defence_plan: "우르키사의 대응"
 MEX_focus_interior_defence_plan_desc: "우르키사에게 있어 키보토스 사태는 기회이자 그에게 내려진 시험이라고 할 수 있습니다. 신의 계시를 거부하고 그들만의 거짓된 혁명을 벌인 이들을 우르키사는 증오하고 있습니다. 그는 더이상 "혁명"이라는 더러운 가치를 보존하지 않을 것입니다. 다시는 멕시코에 혁명이라는 단어가 적히지 않도록 하기 위해서."
 MEX_focus_jefe_maximo: "멕시코의 새로운 혁명"
 MEX_focus_jefe_maximo_desc: "카르데나스 각하의 개혁은 분명히 훌륭한 것들 뿐이지만, 급격하게 변하는 이 세상속에서는 그것만으로는 부족합니다. 멕시코는 키보토스라는 새로운 문물을 받아들여, 새롭게 변화해야만 합니다!"
 MEX_focus_national_bank: "올라, 키보토스!"
 MEX_focus_national_bank_desc: "올라! 키보토스! 멕시코가 따뜻한 환영의 말을 전합니다! 수많은 지구인 국가들이 키보토스를 이계인으로서 보며 불쾌하게 여길지 언정, 마테오스 각하께서는 다릅니다. 시민들을 설득하는 것도, 정부 관료와 군인들을 설득시키는 것도 수많은 시간이 걸리겠지만... 그래도 뭐, 나쁘게 흘러가기라도 하겠습니까? 시민들이야 설득하면 그만이고, 멕시코를 발전시킬수만 있다면 그만입니다!"
 MEX_focus_agricultural_credit_bank: "밀레니엄 방문"
 MEX_focus_agricultural_credit_bank_desc: "유럽에서 넘어온 밀레니엄의 사진을 보게 된다면 모두가 놀라워 할 것입니다. 이 수많은 빌딩들을, 그리고 스스로 움직이는 기계들을 보십시오! 그것들이 멕시코에 존재한다고 상상해 보십시오. 이 얼마나 멋진 광경이겠습니까? 마테오스께서 직접 밀레니엄을 순방하겠다고 하신 만큼, 분명히 좋은 경험이 되실 것입니다."
 MEX_focus_confederation_of_mexican_workers: "트리니티 순방"
 MEX_focus_confederation_of_mexican_workers_desc: "독일 동부에 갑작스레 나타난 트리니티 종합학원 이라는 거대한 세력으로부터 우리가 배울것은 얼마든지 있을 것입니다. 현지로 탈출한 독일인들이 보여준 사진에는 수많은 성녀들이 있었기에 UNS를 자극할지도 모르지만, 뭐, 그건 나중에 생각하고 일단 가보도록 합시다!"
 MEX_focus_rent_freeze: "카이저와의 기술협상"
 MEX_focus_rent_freeze_desc: "카이저 코퍼레이션이라고 불리는 기업에서 재미있는 소식이 들려왔습니다. 그들이 대부분 기계인간이라는 것, 그리고 그 기계인간들이 우리 석유에 관심을 가지고 있다는 사실입니다! 멕시코의 석유를 그들에게 주는 대가로 그들의 기술 판매를 요청한다면, 분명 그들에게도, 우리에게도 큰 도움이 될 것입니다!"
 MEX_focus_ejido_worker_militias: "새로운 산업 기술"
 MEX_focus_party_of_the_revolution: ""인터넷" 도입"
 MEX_focus_party_of_the_revolution_desc: "인터넷은 기적의 기술입니다"
 MEX_focus_rural_infrastructure: "새로운 농업 기술"
 MEX_focus_peripheral_infrastructure: "미래를 향하여"
 MEX_focus_rural_schools: "베테랑을 향한 손길"
 MEX_focus_liberalize_the_banking_sector: "카르데나스 등용"
 MEX_focus_striking_breaking: "광신도 대응"
 MEX_focus_urban_development: "UNS 불법화"
