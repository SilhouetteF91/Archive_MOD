 # 이벤트
 MEX_tutorial.0.t: "OTL 멕시코와의 차이점 - 인물"
 MEX_tutorial.0.desc: "1935년 10월, 유럽이 키보토스라는 이계인들에 의해 쑥대밭이 되기 시작하면서 멕시코 사회와 정계에 크고 작은 변화들이 찾아왔습니다. 가장 먼저 인물입니다. 여기서는 주요 인물만 소개하도록 하겠습니다.\n\n가장 먼저 바닐라 멕시코를 해봤다면 알고 있을 세디요 장군의 처우입니다. 사투르니노 세디요 장군은 라사로 카르데나스의 중앙집권화에 반대했던 인물로서, 원래 세계에서는 1938년 반란의 실패로 감옥에 수감됩니다. 하지만 블루 아카이브 모드의 세계에서는 갑작스레 나타난 키보토스인들과 유럽계 난민들이 들어오면서 나타난 혼란으로 인해, 세디요 장군이 더 빨리 쿠데타를 일으키고 체포됨에 따라 사투르니노 세디요 장군은 카르데나스에게 위협이 되지 않습니다.\n\n두번째로 플루타르코 카예스 입니다. 라사로 카르데나스가 소속된 정당 국민혁명당을 창당한 인물로서, 오브레곤 대통령의 사망이후 뒤를 이은 인물이기도 합니다. 멕시코의 대통령 3명을 자신의 꼭두각시로서 부린 사실상의 독재자였던 그는 원 역사대로였다면 카예스 인사들이 체포되어 무너졌어야 했으나, 대전이의 여파로 인해 카르데나스의 정치적 숙청 과정이 늦어지게 되면서 카예스파가 상대적으로 더 그 위세를 떨치고 있습니다.\n\n세번째로 라사로 카르데나스 입니다. 원래 역사대로 그는 아벨라르도 로드리게스 대통령의 뒤를 이어 집권했으며, 사회 및 경제개혁을 통해 멕시코의 경제 기반을 탄탄히 한 인물입니다. 대전이가 일어난 블루 아카이브 모드에서도 라사로 카르데나스는 여전히 사회 개혁을 일으켜 멕시코를 변화시킬 야망을 가지고 있습니다. 영국의 석유를 미리 국유화 하여 멕시코가 유럽 시장 상실의 피해를 상대적으로 덜 받게 했습니다."
 MEX_tutorial.0.a: "그렇다면 국가 상황은 어떤가요?"
 MEX_tutorial.0.b: "고맙지만 이정도면 충분해요!"
 MEX_tutorial.1.t: "OTL 멕시코와의 차이점 - 국가상황"
 MEX_tutorial.1.desc: "라사로 카르데나스의 종교적 탄압은 여전히 그 위세를 떨치고 있었지만, 이계인들이 유럽을 쑥대밭으로 만들었다는 소식은 구대륙을 넘어 저 멀리 신대륙으로 까지 넘어가기 충분했습니다. 수많은 멕시코인들은 이를 그저 놀라운 일 그 이상 이하로 여기진 않았지만, 카예스, 그리고 카르데나스에게 탄압당하던 가톨릭 신자들은 이를 다르게 보았습니다. 유럽에 나타난 이계인들을 "신의 징벌" 이라고 여겼으며, 1937년에 창당된 현실과는 달리 조금 더 일찍 UNS(국민공동통치연합)가 창당되었습니다.\n\n멕시코 시나키스트들의 연합의 등장, 그리고 갑작스레 나타난 이계인들의 등장과 그에 따른 난민들의 침입에 멕시코 정계는 혼란에 휩싸이기 시작했습니다. 호세 안토니오 우르키사와 살바도르 아바스칼, 그리고 마누엘 토레스 부에노를 중심으로 뭉친 UNS는 멕시코의 "거짓된 혁명"을 청산하고 주님의 딸(키보토스)와 함께 이교도들을 향한 성전을 치룰 것을 주장하고 있습니다.\n\n한편 멕시코 공산당과 좌익계열 정당들은 힘이 상대적으로 약해져 있습니다. 원역사에서 트로츠키를 받아주며 내부적으로 균열이 감과 동시에 인지도를 얻었던 멕시코 공산당은 트로츠키가 멕시코로 망명할 일이 없어지면서 균열이 가지 않게 되었지만, 스탈린주의를 표방했기에 그렇게 까지 큰 인기를 얻지 못했습니다. 멕시코 내부의 스탈린주의 정당으로서 간간히 그 명맥을 이어나가고 있습니다.\n\n마지막으로 멕시코 혁명당입니다. 오늘날 제도혁명당이라는 이름으로 알려져있는 멕시코 혁명당은 OTL에서는 2000년까지 70년동안의 집권을 이어나간 정당이었으며, 라사로 카르데나스의 정책과 멕시코 혁명의 주역들이 모여있는 정당이라는 이점 덕분에 멕시코 내부로부터 커다란 인기를 차지하고 있습니다. 그러나 블루 아카이브 세계에선 그 위세가 상대적으로 꺾여있습니다. 호세 안토니오 우르키사의 세가 조금씩 강해지고 있음에 따라 혁명의 가치를 지켜내야 할 위치에 서있게 된 라사로 카르데나스와 멕시코 혁명당은 어떻게든 멕시코 혁명의 가치를 지켜내야 할 것입니다."
 MEX_tutorial.1.a: "혁명 만세!"
 MEX_tutorial.2.t: "El juventud(청년)"
 MEX_tutorial.2.desc: "멕시코시티는 여느 때와 마찬가지로 열정이 가득한 도시였고, 대전이 이후에도 그러했다. 멕시코시티의 거리에 있는 타코 노점들의 고수와 양파냄새가 묵묵히 유럽에서 벌어지고 있는 재앙을 알리는 신문을 읽고있는 아돌포 로페스 마테오스의 코를 간질였다. 점심을 먹지 않았던 탓에 마테오스는 조금 입맛을 다셨다.\n\n마테오스는 지금까지 벌어지고 있었던 일에 혼란을 느끼고 있었다. 세상에 자신들의 깃발을 꽂았던 대영제국과 프랑스가 허무하게 무너지고, 독일또한 키보토스라는 이계인들에게 무너졌다. 그 유럽이 붕괴된 이유가 무엇이었을까, 제한적인 정보만이 유럽을 통해 저 멀리 북아메리카 대륙으로 향하고 있는 지금 키보토스라는 이들에 대한 정보는 매우 뒤죽박죽이었다. 뿔이 양쪽에 달려있다더니, 천사와 같은 외모와 날개를 지녔다느니, 눈이 매우 거대하여 괴물을 연상케 한다더니와 같은 온갖 다양한 이야기가 그의 귀를 간질였다.\n\n편두통이 다시한번 그를 괴롭혔다. 마테오스는 키보토스라는 이들에 대해 강렬한 호기심을 느꼈다. 그들이 쓰는 무기와 기술이 매우 다르다고 주장하는 유럽에서 멕시코로 들어온 망명자들의 이야기는 마테오스의 심장을 뛰게 만들었다.\n\n어쩌면 키보토스라는 이들은, 카르데나스가 이룩한 것 그 이상으로 멕시코에 번영을 가져다 줄지도 모를 일이었다. 마테오스는 두근거리는 심장을 붙잡고 노점을 향해 소리쳤다." 
 MEX_tutorial.2.a: ""타코 3개 부탁드립니다!""
 MEX_tutorial.3.t: "El veterano(베테랑)"
 MEX_tutorial.3.desc: "대전이 이후로 멕시코에 수많은 일이 닥쳐왔었다. 카르데나스에게 못할 일이 무엇이 있겠는가. 독재자로 변절된 혁명가 플루타르코 카예스의 자신을 꼭두각시로 만들려던 음모를 떨쳐내는 것 까진 좋았으나, 그의 앞에 놓여진 과제는 너무나도 많았다. 중앙은행의 부재, 혁명 이후로 여전히 회복되지 못한 국가, 여전히 남아있는 포르피리아토의 잔불과 UNS와 우르키사의 급진적 발흥이 멕시코 혁명의 베테랑을 끝없이 괴롭혀왔다.\n\n대공황이라는 재앙에 유럽이라는 시장을 잃은 멕시코에게 이는 치명적으로 다가오기 충분했다. 그나마 영국 소유 유전들을 국유화 하여 어느정도 그 손실을 복구해 내는데엔 성공했지만, 그렇다고 전부 회복할 수 있었던 것은 아니었다. 농업사회였던 멕시코에 산업화를 이뤄내야하는 것도 그였다.\n\nUNS가 점점 세를 불려가며 듣도보도 못한 호세 안토니오 우르키사와 그의 정당이 포르피리아토 시절로 멕시코를 다시 돌려놓으려고 하는 지금, 카르데나스의 책임은 더욱 막중했다. 그는 눈앞에 놓여진 에히도 건설 허가 서류에 사인하며 그의 비서에게 넘겨주었다.\n\n멕시코가 어떻게 우르키사와 광신적 가톨릭 신자들로부터 혁명의 가치를 온전히 보전할 수 있을까라는 생각을 하던 와중, 그의 비서가 그의 정신을 깨웠다." 
 MEX_tutorial.3.a: ""각하? 서류 가져왔습니다.""
 MEX_tutorial.4.t: "El católico(가톨릭 신도)"
 MEX_tutorial.4.desc: "우르키사는 갑작스럽게 거대해져버린 UNS 사무소와 산처럼 쌓인 입당신청서를 보며 한숨을 내쉬었다. 대전이 이후 시나키스트 선언을 발표한 그 였지만, UNS는 그에게 있어 정당이 아닌 시민단체 그 이상 이하도 아니었었다. 하지만 유럽에 대전이가 일어나면서 모든것이 달라졌다. 수많은 가톨릭 신도들, 보수주의자들, 그리고 카르데나스 정권에 반대하는 극우주의자들 등등, 너도나도 할 것 없이 UNS에 입당신청서를 내었고, 하루아침에 UNS는 증오스러운 멕시코 혁명당의 적수로서 떠올랐다.\n\n손에 쥔 묵주를 잠시 내려놓은 우르키사는 곧이어 머리를 주물거리며 생각을 가다듬었다. UNS는 일단은 표면적으로 하나되어있었다. 종종 티격거리곤 했던 살바도르 아바스칼과의 관계도 그렇게 썩 나쁜편도 아닌데다가, 대전이로 인해 완전히 무너지기 직전이었던 멕시코 경제에 지쳐 혁명자체를 의심하기 시작한 멕시코인들의 증가는 우르키사에게 매우 좋은 소식이었다.\n\n"이봐, 우르키사, 연설문 가져왔어." 살바도르 아바스칼이 문을 두드렸다. 그의 손에 들린것은 멕시코 혁명당에 맞서기 위한 연설문이었고. 말더듬이 심한 우르키사를 대신해서 아바스칼이 연설문을 레온과 지방 각지에서 읽을 것이다.\n\n우르키사는 연설문의 내용을 읽고는 고개를 끄덕이며 작게 미소지었다. 곧이어 주님의 뜻을 거역한 혁명을 종식시키고, 주님의 딸 키보토스와 함께 이교도들을 향한 성전을 펼칠것을 다짐하며 다시한번 묵주를 쥐었다." 
 MEX_tutorial.4.a: "시나키즘의 발흥"