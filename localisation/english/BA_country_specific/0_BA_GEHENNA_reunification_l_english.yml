l_english:

 # 게헨나 선도부 & 판데모니움 소사이어티 통일 중점
 GEH_unified_gehenna:0 "통일 게헨나"
 GEH_unified_gehenna_desc:0 "판데모니움 소사이어티와 선도부 사이의 갈등은 게헨나의 모두가 알고 있을 만큼 유명했습니다. 이 갈등은 둘 중 하나가 물리적으로 파괴되어야만 해소될 수 있는 형태의 것이었으며, 비극적이지만 [ROOT.GetLeader]의 승리 역시 전쟁을 통해 이루어질 수밖에 없었습니다. 하지만 이 비극 이후, 우리는 재통합된 게헨나, 다시는 분열되지 않을 게헨나를 얻어대는 데 성공했습니다."

 GEH_club_processing:0 "동아리 강제 해산"
 GEH_club_processing_desc:0 "게헨나는 자유의 학원 대신 '동아리의 학원'이라고 불러도 될 만큼 많은 동아리들을 가지고 있습니다. 당연하지만 게헨나 학생들의 모든 개별적인 동아리 활동을 금지할 만큼 우리가 무자비하다는 것은 아닙니다. 키보토스에서는 허용되었던, 총기와 폭력이 포함된 동아리들을 금지해 사회의 질서를 유지하겠다는 뜻입니다."

 GEH_club_integration:0 "동아리 현상유지"
 GEH_club_integration_desc:0 "게헨나는 자유의 학원 대신 '동아리의 학원'이라고 불러도 될 만큼 많은 동아리들을 가지고 있습니다. 질서와 풍기를 근거로 이러한 동아리들의 활동을 무법으로 규정하고 막으려는 움직임도 있지만, 우리는 이러한 무질서가 게헨나에 활력을 불러오고 다양한 아이디어들을 만들어 낸다고 생각합니다."

 GEH_gastronomy_research_group_arrested:0 "미식연구회 억제"
 GEH_total_destruction_operation:0 "총체적인 파괴"
 GEH_club_control:0 "동아리 통제"
