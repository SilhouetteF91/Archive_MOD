 GEH_large_scale_civil_engineering_work:0 "대규모 토목 공사"
 GEH_large_hot_spring:0 "활발한 온천 사업"
 GEH_emergency_medicine_department_support:0 "응급의학부 지원"

 GEH_gehenna_academy:0 "통합된 게헨나의 미래"
 GEH_gehenna_academy_desc:0 "[ROOT.GetLeader] 아래에서 [ROOT.GetName]는 계속해서 발전하고, 또 성장해 나갈 것입니다. 통합된 게헨나의 미래를 이끌어 갈 [ROOT.GetLeader] 정부의 인도 아래에서 우리는 다시는 분열되고 서로 다투지 않을 것입니다."

 GEH_68_problem:0 "[HEU.GetName] 문제"

 ## 선도부 승리 중점
 GEH_the_end_of_pandemonium:0 "만마전의 끝"
 GEH_the_end_of_pandemonium_desc:0 "만마전은 이제 없으며, [ROOT.GetLeader]의 힘이 게헨나 전체를 장악했습니다. 우리는 이제 혼돈이 아닌 질서를 게헨나에 가져올 것이며, 만마전이 한 때 게헨나 땅에 뿌려 놓았던 풍기문란의 잔재들을 모조리 쓸어내 지울 것입니다."

