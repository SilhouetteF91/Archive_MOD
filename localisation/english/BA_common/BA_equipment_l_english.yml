 ### 트리니티 종합학원 ###
 TRM_infantry_equipment_0:0 "임페일먼트/블레싱"
 TRM_infantry_equipment_0_short:0 "임페일먼트"
 TRM_infantry_equipment_0_desc:0 "정의실현부의 의뢰로 구식 총기를 대체하고자 개발된 신형 무기입니다. 우수한 명중률과 준수한 내구성을 자랑하지만, 기존 무기를 완벽히 대체하기에는 다소 부족하다는 평가도 존재합니다."
 TRM_infantry_equipment_1:0 "Quis ut Deus"
 TRM_infantry_equipment_1_short:0 "Quis ut Deus"
 TRM_infantry_equipment_1_desc:0 "꽤 오래전에 트리니티에서 개발된 평범한 기관단총입니다. 대량 생산이 가능한 구조와 높은 연사력 등 몇 가지 장점을 지니고 있으나, 낮은 내구성과 명중률로 인해 아쉬움을 남기고 있습니다."
 TRM_infantry_equipment_2:0 "Sweet Driver"
 TRM_infantry_equipment_2_short:0 "Sweet Driver"
 TRM_infantry_equipment_2_desc:0 "가볍고, 동일한 탄종을 사용하는 총기들 중에서도 반동이 적은 편입니다. 여기에 편의성까지 더해진 트리니티 고유의 소총으로, 우수한 내구성까지 갖추고 있습니다. 다만 독특한 외형으로 인해 사용자들 사이에서 호불호가 갈리는 편입니다."
 TRM_infantry_equipment_3:0 "세이프티"
 TRM_infantry_equipment_3_short:0 "세이프티"
 TRM_infantry_equipment_3_desc:0 "역대 총기들보다 훨씬 가볍고, 간단한 제조 공정을 통해 생산되지만, 높은 내구성과 전반적인 성능 면에서 우수성을 자랑하는 트리니티 기술의 정수가 담긴 총기입니다. 차세대적인 외형 덕분에 사용자들 사이에서도 높은 인기를 얻고 있습니다. 특히 탈부착이 가능한 유탄발사기를 통해 다수의 적을 한 번에 제압할 수 있다는 강력한 장점을 지니고 있습니다."

