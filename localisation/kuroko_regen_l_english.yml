l_english:
 #쿠로코 리젠 시스템 현지화
 kuroko_regen.1.t:0 "쿠로코 재생 시스템 활성화"
 kuroko_regen.1.d:0 "차원 관문 기술이 아누비스 아카이브와의 연결에 성공했습니다. 이제 저희의 고급 감시 시스템이 모든 작전 구역에 걸쳐 쿠로코 특수부대의 상태를 추적합니다. 이 정예 부대가 전투에서 쓰러질 경우, 시스템은 180일 이내에 자동으로 재생 프로토콜을 개시하여 지속적인 전술적 우위를 보장합니다."
 kuroko_regen.1.a:0 "시스템 완전 가동."

 kuroko_regen.2.t:0 "쿠로코 부대 상태 확인"
 kuroko_regen.2.d:0 "감시 시스템이 쿠로코 특수부대의 배치 상태에 대한 정기 점검을 수행하고 있습니다. 현재 작전 매개변수에 따르면 모든 부대는 예상 범위 내에서 정상적으로 기능하고 있습니다."
 kuroko_regen.2.a:0 "계속 감시하라."

 kuroko_regen.3.t:0 "쿠로코 부대 손실 - 재생 프로토콜 개시"
 kuroko_regen.3.d:0 "긴급 경보: 쿠로코 특수부대가 작전 중 전멸했습니다. 아누비스 아카이브가 자동으로 재생 프로토콜을 개시했습니다. 새로운 부대가 180일 이내에 차원 관문 기술을 통해 색채 영토로 배치될 것입니다."
 kuroko_regen.3.a:0 "재생 카운트다운 시작."

 kuroko_regen.4.t:0 "쿠로코 부대 재생 완료"
 kuroko_regen.4.d:0 "재생 절차가 완료되었습니다. 새로운 쿠로코 특수부대가 차원 관문을 통해 나타나 아군 영토에 배치되었습니다. 이 정예 부대들은 이전 부대의 기억과 전술적 전문성을 그대로 이어받아, 우리의 작전 우위를 유지합니다."
 kuroko_regen.4.a:0 "새로운 부대를 배치하라."

 kuroko_regen.5.t:0 "수도 피격 - 시스템 일시 중단"
 kuroko_regen.5.d:0 "적군이 수도 방어선을 돌파하여 차원 관문 기반 시설에 심각한 피해를 입혔습니다. 쿠로코 재생 시스템은 아군 영토를 확보하고 완전한 작전 능력을 복구할 때까지 일시적으로 중단됩니다."
 kuroko_regen.5.a:0 "수도를 사수하라."

 kuroko_regen.6.t:0 "수도 확보 - 시스템 복구"
 kuroko_regen.6.d:0 "아군이 수도에 대한 적의 공격을 성공적으로 격퇴했습니다. 차원 관문 기반 시설이 완전한 기능으로 복구되었으며, 쿠로코 재생 시스템이 다시 가동됩니다."
 kuroko_regen.6.a:0 "작전을 재개하라."

 kuroko_regen.7.t:0 "긴급 쿠로코 소환 가능"
 kuroko_regen.7.d:0 "아군의 군사 상황이 위급해졌습니다. 아누비스 아카이브는 일반적인 재생 시간을 무시하고 즉시 쿠로코 특수부대를 소환할 수 있는 긴급 배치 프로토콜을 제공합니다. 그러나 이 긴급 절차는 상당한 양의 지휘 자원을 소모합니다."
 kuroko_regen.7.a:0 "긴급 소환! (지휘력 -50)"
 kuroko_regen.7.b:0 "일반 재생을 기다린다."

 kuroko_regen.8.t:0 "긴급 쿠로코 부대 배치 완료"
 kuroko_regen.8.d:0 "긴급 프로토콜이 성공적으로 실행되었습니다. 쿠로코 특수부대가 우선순위 차원 관문 채널을 통해 최전선에 즉시 배치되었습니다. 이 부대들은 즉시 전투에 투입될 준비가 되었습니다."
 kuroko_regen.8.a:0 "훌륭하다."

 kuroko_regen.9.t:0 "쿠로코 강화 프로토콜"
 kuroko_regen.9.d:0 "아누비스 아카이브가 쿠로코 특수부대를 강화하기에 최적의 조건을 감지했습니다. 고급 전투 프로토콜을 적용하여 전투 효율성을 크게 향상시킬 수 있지만, 상당한 지휘 자원이 필요합니다."
 kuroko_regen.9.a:0 "부대 강화! (지휘력 -75)"
 kuroko_regen.9.b:0 "현재 능력으로도 충분하다."

 kuroko_regen.10.t:0 "쿠로코 부대 강화 완료"
 kuroko_regen.10.d:0 "쿠로코 특수부대에 강화 프로토콜이 성공적으로 적용되었습니다. 고급 전술 서브루틴과 강화된 장비 구성을 통해 전투 효율성이 크게 향상되었습니다."
 kuroko_regen.10.a:0 "완벽하다."

 kuroko_regen.11.t:0 "쿠로코 증원 프로토콜"
 kuroko_regen.11.d:0 "차원 관문 네트워크가 최적의 안정성에 도달하여 추가 쿠로코 특수부대를 배치할 수 있게 되었습니다. 이번 기회로 아군의 정예 부대 역량이 크게 확장될 것입니다."
 kuroko_regen.11.a:0 "추가 부대 배치! (지휘력 -100)"
 kuroko_regen.11.b:0 "지금은 한 부대로 충분하다."

 #툴팁과 효과 설명
 kivotos_kuroko_add1_tt:0 "§Y쿠로코 특수부대§! 슬롯 1개 잠금 해제"
 kuroko_regen_system_tooltip:0 "§Y쿠로코 재생 시스템§!은 손실된 쿠로코 부대를 180일 이내에 자동으로 복구합니다"
 kuroko_emergency_summon_tooltip:0 "긴급 프로토콜을 사용하여 §Y지휘력§! 50을 소모해 새로운 §Y쿠로코 특수부대§!를 즉시 소환할 수 있습니다"
 kuroko_enhancement_tooltip:0 "§Y지휘력§! 75를 소모하여 현재 쿠로코 부대를 고급 전투 프로토콜로 강화할 수 있습니다"
 kuroko_reinforcement_tooltip:0 "§Y지휘력§! 100을 소모하여 추가 §Y쿠로코 특수부대§!를 소환할 수 있습니다"